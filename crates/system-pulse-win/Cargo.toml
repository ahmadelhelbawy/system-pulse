[package]
name = "system-pulse-win"
version = "2.0.0"
edition = "2021"
description = "Windows-specific telemetry collectors for System Pulse"
license = "MIT"

[lib]
name = "system_pulse_win"
path = "src/lib.rs"

[dependencies]
# `default-features = false`: this crate never touches `system-pulse-core`'s
# `history` feature (bundled rusqlite), and disabling it here is what lets
# `cargo check --target x86_64-pc-windows-msvc -p system-pulse-win` verify
# this crate in isolation in this repo's sandbox (which has no MSVC-ABI C
# toolchain for rusqlite's bundled build script — see
# `system-pulse-core::history`'s module doc). Harmless for the real app
# binary: Cargo unifies features across a shared dependency, so `src-tauri`
# asking for `history` still turns it on for the final build regardless of
# what this crate declares.
system-pulse-core = { path = "../system-pulse-core", default-features = false }
parking_lot = "0.12"
# Event Log bookmark persistence (Phase 5) — plain per-channel XML-string
# JSON, not a database; already a proven dependency via system-pulse-core.
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    # Phase 3: services (SCM), drivers (SetupAPI), startup/uninstall
    # (registry), and the COM/WMI/Task Scheduler spike.
    "Win32_System_Services",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # Phase 4: storage health (SMART/NVMe via DeviceIoControl) and the
    # LibreHardwareMonitor WMI sensor bridge (Wmi/Variant already above).
    "Win32_System_Ioctl",
    "Win32_System_IO",
    # Phase 5: Event Log (EvtQuery/EvtNext/bookmarks), Security Center
    # (WscGetSecurityProviderHealth), firewall (INetFwPolicy2, COM —
    # Com/Variant/Ole already above), and code-signature verification
    # (WinVerifyTrust) for the persistence checks.
    "Win32_System_EventLog",
    "Win32_System_SecurityCenter",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
] }
# Safe registry access for startup entries / installed-software enumeration
# (Phase 3) — already a proven dependency in src-tauri (autostart), reused
# here rather than hand-rolling `RegEnumValueW`/`RegQueryValueExW` FFI.
winreg = "0.55"
