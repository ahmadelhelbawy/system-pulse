[package]
name = "system-pulse-core"
version = "2.0.0"
edition = "2021"
description = "Telemetry engine and domain logic for System Pulse"
license = "MIT"

[lib]
name = "system_pulse_core"
path = "src/lib.rs"

[[bin]]
name = "system-pulse-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "sanitize"
path = "src/bin/sanitize.rs"

[features]
default = ["history"]
# SQLite-backed history store (samples_raw + rollups). A Cargo feature per
# the master plan, not a runtime flag: rusqlite (bundled) adds a compiled-C
# dependency, and this makes it possible to build/test the rest of the
# engine without that dependency if it ever becomes a problem on a given
# host/toolchain (e.g. the Windows MSVC cross-check environment).
history = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sysinfo = "0.39"
nvml-wrapper = "0.12"
parking_lot = "0.12"
ts-rs = "12.0.1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
