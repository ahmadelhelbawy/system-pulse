[package]
name = "system-pulse"
version = "0.1.0"
description = "System Pulse - a fast, native Windows system monitor"
authors = ["System Pulse"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the binary name (a Windows
# requirement; see https://github.com/rust-lang/cargo/issues/8519).
name = "system_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
system-pulse-core = { path = "../crates/system-pulse-core" }
system-pulse-win = { path = "../crates/system-pulse-win" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
winreg = "0.55"
