name: Windows release build

# Runs the full regression suite and produces the real Windows desktop
# artifact (system-pulse.exe + the NSIS installer) on a genuine Windows
# runner with MSVC and WebView2 available. This exists because the local
# dev machine's Smart App Control policy (enforced, deliberately left
# untouched) blocks freshly-compiled unsigned build-script executables —
# see RELEASE_STATUS.md for the full explanation. GitHub's windows-latest
# runner has no such policy, so this is the actual release path.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # `cache: pnpm` is deliberately omitted: `actions/setup-node`'s cache
      # priming runs `pnpm store path`, which fails with "packages field
      # missing or empty" against this repo's `pnpm-workspace.yaml` (present
      # only for its `allowBuilds` build-script-approval setting, with no
      # `packages:` field — a single-package repo has no workspace members
      # to list). Confirmed via a real failed run (33375083198) on this
      # workflow, not a hypothetical. No caching here just costs a slightly
      # slower install, never a correctness issue.
      # Node 20 fails "Frontend tests" on this runner: jsdom@30's bundled
      # undici@8 calls `webidl.util.markAsUncloneable`, which Node 20 lacks
      # (TypeError inside CacheStorage's constructor, crashing every vitest
      # forked worker — confirmed via a real failed run, 33375916143). Node
      # 22 is what's actually used locally (v22.23.1) and has the API.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # ts-rs's export tests populate target/ts-bindings, which
      # gen-contracts.mjs --check compares against the committed
      # src/lib/contracts.ts — this is the same drift check the plan
      # requires and only runs for real on a native Windows/MSVC host.
      - name: Regenerate TS bindings
        run: cargo test -p system-pulse-core --lib export_bindings

      - name: Verify contracts.ts has no drift
        run: node scripts/gen-contracts.mjs --check

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Rust fmt check
        run: cargo fmt --all --check

      - name: Rust clippy (core + win)
        run: cargo clippy -p system-pulse-core -p system-pulse-win --all-targets -- -D warnings

      - name: Rust tests — system-pulse-core (native Windows, history feature on)
        run: cargo test -p system-pulse-core

      - name: Rust tests — system-pulse-win (native Windows)
        run: cargo test -p system-pulse-win

      - name: Windows-target check — system-pulse-win
        run: cargo check -p system-pulse-win --target x86_64-pc-windows-msvc

      # `tauri build` builds the frontend (beforeBuildCommand), compiles
      # the app in release mode with the `custom-protocol` feature so the
      # embedded dist/ is used instead of a dev server, and produces the
      # NSIS installer per src-tauri/tauri.conf.json's bundle config.
      - name: Build System Pulse (release + NSIS installer)
        run: pnpm tauri build

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: system-pulse-exe
          path: src-tauri/target/release/system-pulse.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: system-pulse-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
